// Opt-in headless probe. Normal runServer/runClient never receive the test mod.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    if (p.hasProperty('earthNtmJar')) {
        p.dependencies.add('runtimeOnlyNonPublishable', p.dependencies.rfg.deobf(p.files(p.property('earthNtmJar'))))
        p.tasks.named('runServer',JavaExec) { systemProperty 'efr.ntmOriginalJar',p.file(p.property('earthNtmJar')).absolutePath }
    }
    if (p.hasProperty('earthGtnhLibJar')) p.dependencies.add('runtimeOnlyNonPublishable',p.dependencies.rfg.deobf(p.files(p.property('earthGtnhLibJar'))))
    if (p.hasProperty('earthHarvestJar')) p.dependencies.add('runtimeOnlyNonPublishable',p.dependencies.rfg.deobf(p.files(p.property('earthHarvestJar'))))
    if (p.hasProperty('earthAe2Jar')) p.dependencies.add('runtimeOnlyNonPublishable',p.dependencies.rfg.deobf(p.files(p.property('earthAe2Jar'))))
    if (p.hasProperty('earthIronChestsDevJar')) p.dependencies.add('runtimeOnlyNonPublishable',p.files(p.property('earthIronChestsDevJar')))
    p.tasks.named('runServer', JavaExec) {
        dependsOn p.tasks.named('compileEarthImportTests')
        if (p.hasProperty('earthGtnhLibJar')) doFirst {
            classpath = p.files(classpath.files.findAll { !it.name.startsWith('GTNHLib-0.11.4-') })
        }
        classpath += p.files(p.layout.buildDirectory.dir('earth-import-tests/classes'))
        workingDir = p.file('build/earth-import-tests/' + (p.hasProperty('earthNtmJar') ? 'ntm-' : '') + (p.hasProperty('earthIronChestsDevJar') ? 'ironchests-' : '') + (p.findProperty('earthProfile') == 'legacy' ? 'legacy-server' : 'server'))
        if (p.hasProperty('profileNetworkServer')) {
            workingDir = p.file('build/profile-network-tests/' + p.property('profileNetworkServer'))
            systemProperty 'efr.profileNetworkServer', 'true'
        }
        systemProperty 'efr.earthImportProbe', 'true'
        systemProperty 'efr.earthImportProfile', p.findProperty('earthProfile') ?: 'earth'
        if (p.hasProperty('earthHarvestJar')) {
            workingDir = p.file('build/earth-harvest-tests/server')
            systemProperty 'efr.harvestCaptureProbe', 'true'
        }
        if (p.hasProperty('earthStructureDetailCaptures')) {
            workingDir = p.file('build/earth-structure-detail-tests/server')
            systemProperty 'efr.structureDetailCaptures', p.property('earthStructureDetailCaptures')
        }
        if (p.hasProperty('earthSkyLightProbe')) {
            workingDir = p.file('build/earth-skylight-tests/server')
            systemProperty 'efr.skyLightProbe', 'true'
        }
        if (p.hasProperty('earthStructureGroundProbe')) systemProperty 'efr.structureGroundProbe', 'true'
        if (p.hasProperty('earthFlaggedStateProbe')) {
            workingDir = p.file('build/earth-flagged-state-tests/server')
            systemProperty 'efr.flaggedStateProbe', 'true'
        }
        if (p.hasProperty('earthAe2Only')) {
            workingDir = p.file('build/earth-ae2-tests/server')
            systemProperty 'efr.ae2ResourceProbe', 'true'
            if (p.hasProperty('earthAe2Artifacts')) systemProperty 'efr.ae2Artifacts', p.property('earthAe2Artifacts')
        }
        if (p.hasProperty('earthWaterFlowProbe')) systemProperty 'efr.waterFlowProbe','true'
        if (p.hasProperty('earthAdaptedNtmTiles')) systemProperty 'efr.adaptedNtmTiles',p.property('earthAdaptedNtmTiles')
        if (p.hasProperty('earthConvertedDungeons')) systemProperty 'efr.ntmConvertedDungeons', p.property('earthConvertedDungeons')
        if (p.hasProperty('earthConvertedRuins')) systemProperty 'efr.ntmConvertedRuins', p.property('earthConvertedRuins')
        if (p.hasProperty('earthStructureCapture')) {
            systemProperty 'efr.ntmStructureCaptureProbe', 'true'
            classpath += p.files('src/testEarthImport/resources')
            args '--tweakClass','efrtweak.StructureCaptureTweaker'
        }
        if (p.hasProperty('earthResourcesOnly')) {
            workingDir = p.file(p.findProperty('earthResourceWorkdir') ?: 'build/earth-resource-tests/server')
            systemProperty 'efr.ntmResourceProbe', 'true'
            if (p.hasProperty('earthConvertedChunk')) systemProperty 'efr.convertedResourceChunk', p.property('earthConvertedChunk')
        }
    }
}
