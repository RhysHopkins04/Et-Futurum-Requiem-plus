// Always-on data contracts. Probe classes remain outside the distributable source set.
def earthTestClasses = layout.buildDirectory.dir('earth-import-tests/classes')
def earthTestCompile = tasks.register('compileEarthImportTests', JavaCompile) {
    dependsOn tasks.named('classes')
    source = fileTree('src/testEarthImport/java') { include '**/*.java' }
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = earthTestClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.compilerArgs += ['-proc:none']
}
def earthContracts = tasks.register('earthImportContracts', JavaExec) {
    dependsOn earthTestCompile
    classpath = sourceSets.main.runtimeClasspath + files(earthTestClasses)
    mainClass = 'efrtest.EarthImportContracts'
}
tasks.named('check') { dependsOn earthContracts }

// Headless development probes cannot catch missing production client method mappings.
def earthArchiveBase = tasks.named('jar').get().archiveBaseName.get()
def earthReleaseJar = layout.buildDirectory.file("libs/${earthArchiveBase}-${project.version}.jar").get().asFile
def earthReleaseMappings = tasks.register('earthImportReleaseMappings') {
    dependsOn tasks.named('reobfJar')
    doLast {
        def releaseJar = earthReleaseJar
        def archive = new java.util.zip.ZipFile(releaseJar)
        try {
            def entry = archive.getEntry('mixins.etfuturum.refmap.json')
            if (entry == null) throw new GradleException('Release jar is missing the mixin refmap')
            def refmap = new groovy.json.JsonSlurper().parse(archive.getInputStream(entry))
            def owner = 'ganymedes01/etfuturum/mixins/early/imported/client/MixinWorldProvider'
            def expected = 'Lnet/minecraft/world/WorldProvider;func_76571_f()F'
            if (refmap.mappings[owner]?.getCloudHeight != expected) {
                throw new GradleException('Imported client cloud hook is missing its production mapping')
            }
            def profileMappings = [
                'ganymedes01/etfuturum/mixins/early/profile/client/MixinChunk': [getBiomeGenForWorldCoords: 'func_76591_a'],
                'ganymedes01/etfuturum/mixins/early/profile/client/MixinMinecraft': ['loadWorld(Lnet/minecraft/client/multiplayer/WorldClient;Ljava/lang/String;)V': 'func_71353_a', runTick: 'func_71407_l']
            ]
            profileMappings.each { ownerName, methods -> methods.each { method, srg ->
                if (!refmap.mappings[ownerName]?.get(method)?.contains(srg))
                    throw new GradleException("Server profile production mapping missing: ${ownerName}/${method}")
            } }
            def prefix = 'ganymedes01/etfuturum/mixins/early/imported/'
            def required = [
                'MixinWorld': ['setBlock(IIILnet/minecraft/block/Block;II)Z': 'func_147465_d', setBlockMetadataWithNotify: 'func_72921_c', setTileEntity: 'func_147455_a', removeTileEntity: 'func_147475_p', getTileEntity: 'func_147438_o'],
                'MixinChunkProviderServer': [populate: 'func_73153_a', 'Lnet/minecraft/world/chunk/IChunkProvider;populate(Lnet/minecraft/world/chunk/IChunkProvider;II)V': 'func_73153_a'],
                'client/MixinBlockLiquid': [colorMultiplier: 'func_149720_d'],
                'MixinVillageGround': [getAverageGroundLevel: 'func_74889_b', 'Lnet/minecraft/world/WorldProvider;getAverageGroundLevel()I': 'func_76557_i'],
                'MixinScatteredFeatureGround': [func_74935_a: 'func_74935_a', 'Lnet/minecraft/world/WorldProvider;getAverageGroundLevel()I': 'func_76557_i']
            ]
            required.each { mixin, methods -> methods.each { method, srg ->
                if (!refmap.mappings[prefix+mixin]?.get(method)?.contains(srg))
                    throw new GradleException("Imported-world production mapping missing: ${mixin}/${method}")
            } }
            def ntmGround = refmap.mappings['ganymedes01/etfuturum/mixins/late/ntm/MixinStructureGround']
            if (ntmGround?.get('Lnet/minecraft/world/WorldProvider;getAverageGroundLevel()I') != 'Lnet/minecraft/world/WorldProvider;func_76557_i()I')
                throw new GradleException('NTM structure ground hook is missing its production mapping')
            if (archive.entries().any { it.name.startsWith('efrtest/') }) throw new GradleException('Test fixture leaked into release jar')
            logger.lifecycle('Imported cloud, population guard and water production mappings verified in {}', releaseJar.name)
        } finally {
            archive.close()
        }
    }
}
tasks.named('check') { dependsOn earthReleaseMappings }
