plugins {
    id("com.gtnewhorizons.gtnhconvention")
}

apply from: 'scripts/wargames-version.gradle'
version = gradle.ext.wgVersion

// Preserve upstream snapshot behaviour independently of the release filename.
def details = versionDetails()
boolean isTaggedRelease = details.getCommitDistance() == 0 && !details.lastTag.isEmpty() && details.getIsCleanTag()
boolean stableTag = !details.lastTag.isEmpty() && !['-rc-', 'alpha', 'beta', 'candidate', 'snapshot'].any { details.lastTag.contains(it) }

minecraft {
    injectedTags.put("MOD_ID", project.modId)
    injectedTags.put("MOD_NAME", project.modName)
    injectedTags.put("MOD_GROUP", project.modGroup)
    // Release names and Forge metadata share the Wargames version.
    injectedTags.put("VERSION", project.version.toString())
    injectedTags.put("SNAPSHOT_BUILD", !isTaggedRelease)
    injectedTags.put("STABLE_BUILD", isTaggedRelease && stableTag)

    injectedTags.put("MC_ASSET_VER", "minecraft_1.21.11")
}

// Import data-format contracts run in every ordinary check/build; runtime probes stay opt-in.
apply from: 'scripts/earth_import_contracts.gradle'
